[package]
authors = ["Without Boats <boats@mozilla.com>"]
description = "bridge non-PGP system to PGP data format"
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
name = "pbp"
version = "0.5.0"
repository = "https://github.com/withoutboats/pbp"

[dependencies]
base64 = "0.13.1"
byteorder = "1.4.3"
digest = "0.10.5"
sha1 = "0.10.5"
typenum = "1.15.0"
failure = "0.1.8"
bitflags = "1.3.2"
rand = "0.8.5"
sha2 = "0.10.6"

[dependencies.ed25519-dalek]
version = "1.0.1"
optional = true

[features]
dalek = ["ed25519-dalek"]

[dev-dependencies]
ed25519-dalek = "1.0.1"

[[example]]
required-features = ["dalek"]
name = "print"
path = "examples/print.rs"

[[example]]
required-features = ["dalek"]
name = "read_sig"
path = "examples/read_sig.rs"

[[example]]
required-features = ["dalek"]
name = "round_trip"
path = "examples/round_trip.rs"

[[example]]
required-features = ["dalek"]
name = "verify_sig"
path = "examples/verify_sig.rs"
