[package]
authors = ["Without Boats <boats@mozilla.com>"]
description = "bridge non-PGP system to PGP data format"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
name = "pbp"
version = "0.7.0"
repository = "https://github.com/withoutboats/pbp"

[dependencies]
base64 = "0.22"
byteorder = "1.5"
digest = "0.10"
sha1 = "0.10"
typenum = "1.17"
thiserror = "2.0"
bitflags = "2.10"
rand = "0.8"
sha2 = "0.10"

[dependencies.ed25519-dalek]
version = "2.1"
optional = true
features = ["rand_core"]

[features]
dalek = ["ed25519-dalek"]

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

[[example]]
required-features = ["dalek"]
name = "print"
path = "examples/print.rs"

[[example]]
required-features = ["dalek"]
name = "read_sig"
path = "examples/read_sig.rs"

[[example]]
required-features = ["dalek"]
name = "round_trip"
path = "examples/round_trip.rs"

[[example]]
required-features = ["dalek"]
name = "verify_sig"
path = "examples/verify_sig.rs"
